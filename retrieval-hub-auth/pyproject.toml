[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieval-hub-auth"
version = "0.0.1"
description = "Auth service for retrieval-hub: OAuth 2.1 client_credentials issuer, JWKS, JWT validator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "retrieval-hub authors" },
]
keywords = ["retrieval-hub", "oauth", "jwt", "auth", "openshift"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # HTTP framework + ASGI server
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    # Required for FastAPI Form(...) parsing on the /token endpoint
    "python-multipart>=0.0.9",
    # Config + claim models
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2",
    # Persistence
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1,<4.0",
    # JWT + crypto: authlib dispatches to the `cryptography` package which
    # delegates RS256 signing to OS-level OpenSSL (FIPS-friendly).
    "authlib>=1.3",
    "cryptography>=42.0",
    # Client secret hashing
    "argon2-cffi>=23.1",
    # ULID for jti
    "python-ulid>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/redhat-ai-americas/retrieval-hub"
Documentation = "https://github.com/redhat-ai-americas/retrieval-hub/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_hub_auth"]

[tool.hatch.build.targets.sdist]
include = [
    "src/retrieval_hub_auth",
    "alembic",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["src/retrieval_hub_auth"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "N818"]
# FastAPI routes use ``Depends(...)`` as a default value; this is the
# documented idiom and the only place B008 should fire.
"src/retrieval_hub_auth/routes/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["authlib.*", "argon2.*"]
ignore_missing_imports = true
