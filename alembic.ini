# Alembic configuration for retrieval-hub.
#
# The database URL is intentionally not set here at install time. We always
# read it from the RETRIEVAL_HUB_DB_URL environment variable in env.py so that
# the same alembic.ini works in dev, CI, and OpenShift without rewriting.
#
# WARNING: the dev fallback used by env.py points at a local Postgres on
# localhost:5432. Do not rely on it for anything other than local dev.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
