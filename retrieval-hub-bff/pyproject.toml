[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieval-hub-bff"
version = "0.1.0"
description = "Backend-for-frontend service for the RetrievalHub UI"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "retrieval-hub",
    "fastapi>=0.133.0",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_hub_bff"]
