---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: retrieval-hub-bff
  labels:
    app: retrieval-hub-bff
spec:
  output:
    to:
      kind: ImageStreamTag
      name: retrieval-hub-bff:latest
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  resources:
    limits:
      memory: 4Gi
      cpu: "2"
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: retrieval-hub-bff
  labels:
    app: retrieval-hub-bff
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-hub-bff
  labels:
    app: retrieval-hub-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retrieval-hub-bff
  template:
    metadata:
      labels:
        app: retrieval-hub-bff
    spec:
      containers:
      - name: retrieval-hub-bff
        image: retrieval-hub-bff:latest
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: RETRIEVAL_HUB_DB_URL
          valueFrom:
            secretKeyRef:
              name: retrieval-hub-pg
              key: RETRIEVAL_HUB_DB_URL
        - name: RETRIEVAL_HUB_VECTORS_DB_URL
          valueFrom:
            secretKeyRef:
              name: retrieval-hub-pg
              key: RETRIEVAL_HUB_VECTORS_DB_URL
        - name: MCP_PUBLIC_URL
          value: "https://retrieval-hub-mcp-retrieval-hub.apps.cluster-z9hbt.z9hbt.sandbox1495.opentlc.com/mcp"
        - name: LLM_ENDPOINT_URL
          value: "http://gpt-oss-120b-direct.gpt-oss-120b-model.svc:8080/v1/chat/completions"
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 1Gi
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-hub-bff
  labels:
    app: retrieval-hub-bff
spec:
  selector:
    app: retrieval-hub-bff
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
