# Model health probe — runs every 5 minutes to check embedding endpoint status.
#
# Uses the MCP server image (which includes the core library and probe script).
# Updates model_endpoint.status and last_probed in the catalog database.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-health-probe
  namespace: retrieval-hub
  labels:
    app: retrieval-hub
    component: model-health-probe
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: retrieval-hub
            component: model-health-probe
        spec:
          restartPolicy: Never
          containers:
          - name: probe
            image: image-registry.openshift-image-registry.svc:5000/retrieval-hub/retrieval-hub-mcp:latest
            command: ["/bin/sh", "-c"]
            args: ["python scripts/probe_model_endpoints.py --db-url $RETRIEVAL_HUB_DB_URL --json-log"]
            env:
            - name: RETRIEVAL_HUB_DB_URL
              valueFrom:
                secretKeyRef:
                  name: retrieval-hub-pg
                  key: RETRIEVAL_HUB_DB_URL
            resources:
              requests:
                memory: 128Mi
                cpu: 100m
              limits:
                memory: 256Mi
                cpu: 200m
