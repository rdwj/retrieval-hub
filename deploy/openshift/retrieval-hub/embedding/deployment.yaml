# Model weights are stored on a PVC (retrieval-hub-model-cache) so they
# survive pod restarts and can be pre-populated before migrating a data
# source to a new cluster.  When moving a source between RetrievalHub
# clusters, copy the PVC contents to bring the embedding model along
# without re-downloading from Hugging Face Hub.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-hub-embedding
  namespace: retrieval-hub
  labels:
    app: retrieval-hub
    component: embedding
    model: pubmedbert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retrieval-hub
      component: embedding
  template:
    metadata:
      labels:
        app: retrieval-hub
        component: embedding
        model: pubmedbert
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
          args:
            - "--model-id"
            - "NeuML/pubmedbert-base-embeddings"
            - "--port"
            - "8080"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HUGGINGFACE_HUB_CACHE
              value: /data
          volumeMounts:
            - name: model-cache
              mountPath: /data
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: retrieval-hub-model-cache
