# vLLM embedding model service — Nomic Embed Text v1.5
#
# GPU-accelerated embedding model served via vLLM's OpenAI-compatible API.
# Replaces TEI (CPU) for batch ingestion; TEI had a memory leak that caused
# OOM restarts every ~25 minutes under sustained load.
#
# Model:     nomic-ai/nomic-embed-text-v1.5
# Dimension: 768
# License:   Apache-2.0
# Endpoint:  http://vllm-nomic-embedding:8000
# API:       POST /v1/embeddings  (OpenAI-compatible)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-nomic-model-cache
  namespace: retrieval-hub
  labels:
    app: retrieval-hub
    component: embedding
    model: nomic-v1.5
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp3-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-nomic-embedding
  namespace: retrieval-hub
  labels:
    app: retrieval-hub
    component: embedding
    model: nomic-v1.5
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: retrieval-hub
      component: embedding
      model: nomic-v1.5
  template:
    metadata:
      labels:
        app: retrieval-hub
        component: embedding
        model: nomic-v1.5
    spec:
      enableServiceLinks: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.8.5
          command: ["vllm", "serve"]
          args:
            - "nomic-ai/nomic-embed-text-v1.5"
            - "--task"
            - "embed"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "512"
            - "--trust-remote-code"
            - "--hf-overrides"
            - '{"rotary_scaling_factor": 1.0}'
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HF_HOME
              value: /model-cache
            - name: TRANSFORMERS_CACHE
              value: /model-cache
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-nomic-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-nomic-embedding
  namespace: retrieval-hub
  labels:
    app: retrieval-hub
    component: embedding
    model: nomic-v1.5
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: retrieval-hub
    component: embedding
    model: nomic-v1.5
