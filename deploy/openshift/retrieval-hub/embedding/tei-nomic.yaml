# Nomic v1.5 embedding model service — Text Embeddings Inference (TEI).
#
# RETIRED: Replaced by vLLM GPU serving (vllm-nomic.yaml) as of 2026-09-09.
# Scaled to 0 replicas. Keep manifest for reference; TEI had a memory leak
# that caused OOM restarts every ~25 min under batch load.
# Endpoint:      http://retrieval-hub-embedding-nomic:8080
# API:           POST /embed  {"inputs": ["text1", "text2"]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retrieval-hub-embedding-nomic-cache
  namespace: retrieval-hub
  labels:
    app: retrieval-hub
    component: embedding-nomic
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp3-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-hub-embedding-nomic
  namespace: retrieval-hub
  labels:
    app: retrieval-hub
    component: embedding-nomic
    model: nomic-v1.5
spec:
  replicas: 0
  selector:
    matchLabels:
      app: retrieval-hub
      component: embedding-nomic
  template:
    metadata:
      labels:
        app: retrieval-hub
        component: embedding-nomic
        model: nomic-v1.5
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
          args:
            - "--model-id"
            - "nomic-ai/nomic-embed-text-v1.5"
            - "--port"
            - "8080"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HUGGINGFACE_HUB_CACHE
              value: /data
          volumeMounts:
            - name: model-cache
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: retrieval-hub-embedding-nomic-cache
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-hub-embedding-nomic
  namespace: retrieval-hub
  labels:
    app: retrieval-hub
    component: embedding-nomic
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: retrieval-hub
    component: embedding-nomic
