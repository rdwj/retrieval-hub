# Memgraph graph database for RetrievalHub knowledge graph.
#
# The MCP server needs MEMGRAPH_BOLT_URI=bolt://memgraph:7687 added
# to its env in retrieval-hub-mcp/openshift.yaml to connect.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memgraph-data
  labels:
    app: memgraph
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memgraph
  labels:
    app: memgraph
spec:
  serviceName: memgraph
  replicas: 1
  selector:
    matchLabels:
      app: memgraph
  template:
    metadata:
      labels:
        app: memgraph
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000740000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      containers:
      - name: memgraph
        image: docker.io/memgraph/memgraph:latest
        command: ["sh", "-c"]
        args:
          - |
            mkdir -p /var/lib/memgraph/data
            exec /usr/lib/memgraph/memgraph \
              --log-file= \
              --also-log-to-stderr \
              --log-level=WARNING \
              --data-directory=/var/lib/memgraph/data
        ports:
        - containerPort: 7687
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: "1"
        volumeMounts:
        - name: memgraph-data
          mountPath: /var/lib/memgraph
      volumes:
      - name: memgraph-data
        persistentVolumeClaim:
          claimName: memgraph-data
---
apiVersion: v1
kind: Service
metadata:
  name: memgraph
  labels:
    app: memgraph
spec:
  type: ClusterIP
  selector:
    app: memgraph
  ports:
  - port: 7687
    targetPort: 7687
    protocol: TCP
