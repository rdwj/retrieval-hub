apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-hub-ui
  labels:
    app.kubernetes.io/name: retrieval-hub-ui
    app.kubernetes.io/part-of: retrieval-hub
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: retrieval-hub-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retrieval-hub-ui
        app.kubernetes.io/part-of: retrieval-hub
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: nginx
          image: image-registry.openshift-image-registry.svc:5000/retrieval-hub/retrieval-hub-ui:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
