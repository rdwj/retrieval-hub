# Live-data SPA routing + BFF reverse proxy.
# Dropped into /opt/app-root/etc/nginx.default.d/ so the UBI nginx image's
# default server block picks it up automatically.

# Proxy API requests to the BFF service in the same namespace.
location /api/ {
    proxy_pass http://retrieval-hub-bff:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# SPA fallback: serve index.html for any path that doesn't match a static file.
location / {
    try_files $uri $uri/ /index.html;
}

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 256;
