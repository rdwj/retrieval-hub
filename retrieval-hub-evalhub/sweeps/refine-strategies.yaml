sweep_id: refine-strategy-sweep
description: >
  Compare how the refine tool affects end-to-end answer quality.
  Baseline (no refine) should match known v2 results: ctx_prec ~0.738,
  ans_rel ~0.723, faithfulness ~0.806.
runs:
  - run_id: refine-none
    refine_strategy: ""
    refine_window: 0
  - run_id: refine-adjacent-2
    refine_strategy: adjacent
    refine_window: 2
  - run_id: refine-adjacent-4
    refine_strategy: adjacent
    refine_window: 4
  - run_id: refine-section
    refine_strategy: section
    refine_window: 0
