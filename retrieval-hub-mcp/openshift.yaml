---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: retrieval-hub-mcp
  labels:
    app: retrieval-hub-mcp
spec:
  output:
    to:
      kind: ImageStreamTag
      name: retrieval-hub-mcp:latest
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  resources:
    limits:
      memory: 4Gi
      cpu: "2"
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: retrieval-hub-mcp
  labels:
    app: retrieval-hub-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-hub-mcp
  labels:
    app: retrieval-hub-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retrieval-hub-mcp
  template:
    metadata:
      labels:
        app: retrieval-hub-mcp
    spec:
      containers:
      - name: retrieval-hub-mcp
        image: retrieval-hub-mcp:latest
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: MCP_TRANSPORT
          value: "http"
        - name: MCP_HTTP_HOST
          value: "0.0.0.0"
        - name: MCP_HTTP_PORT
          value: "8080"
        - name: RETRIEVAL_HUB_DB_URL
          valueFrom:
            secretKeyRef:
              name: retrieval-hub-pg
              key: RETRIEVAL_HUB_DB_URL
        - name: RETRIEVAL_HUB_VECTORS_DB_URL
          valueFrom:
            secretKeyRef:
              name: retrieval-hub-pg
              key: RETRIEVAL_HUB_VECTORS_DB_URL
        - name: RETRIEVAL_HUB_AUTH_JWKS_URI
          value: "http://retrieval-hub-auth:8080/.well-known/jwks.json"
        - name: RETRIEVAL_HUB_AUTH_ISSUER
          value: "retrieval-hub-auth"
        - name: RETRIEVAL_HUB_AUTH_AUDIENCE
          value: "retrieval-hub"
        - name: RETRIEVAL_HUB_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: retrieval-hub-google-oauth
              key: RETRIEVAL_HUB_GOOGLE_CLIENT_ID
              optional: true
        - name: RETRIEVAL_HUB_GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: retrieval-hub-google-oauth
              key: RETRIEVAL_HUB_GOOGLE_CLIENT_SECRET
              optional: true
        - name: RETRIEVAL_HUB_GOOGLE_BASE_URL
          value: "https://retrieval-hub-mcp-retrieval-hub.apps.cluster-z9hbt.z9hbt.sandbox1495.opentlc.com"
        - name: MEMGRAPH_BOLT_URI
          value: "bolt://memgraph:7687"
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 1Gi
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-hub-mcp
  labels:
    app: retrieval-hub-mcp
spec:
  selector:
    app: retrieval-hub-mcp
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: retrieval-hub-mcp
  labels:
    app: retrieval-hub-mcp
spec:
  to:
    kind: Service
    name: retrieval-hub-mcp
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
